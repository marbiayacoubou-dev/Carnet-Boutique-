<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A7A54">

<meta name="mobile-web-app-capable" content="yes">

<link rel="apple-touch-icon" href="icon-192.png">

<body>
<title>Carnet Boutique</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: une colonne étroite pour le téléphone. Gros total "À encaisser" en tête, liste dessous,
   bouton flottant "Nouvelle vente" et barre de navigation fixe en bas (Ventes, Clients, Bilan, Réglages). */
:root {
  --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --bg: #F1F5F2;
  --surface: #FFFFFF;
  --ink: #12201B;
  --muted: #566861;
  --line: #D9E3DE;
  --accent: #0A7A54;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCF0E6;
  --warn: #B4400C;
  --warn-soft: #FBE5D8;
  --amber: #7F5400;
  --amber-soft: #FAEDCB;
  --shadow: 0 1px 2px rgba(18, 32, 27, .06), 0 10px 28px rgba(18, 32, 27, .07);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1613; --surface: #16211D; --ink: #E7F0EC; --muted: #93A59D; --line: #26342E;
    --accent: #3DD29A; --accent-ink: #06261A; --accent-soft: #12372A;
    --warn: #FF9B6B; --warn-soft: #3A2218; --amber: #F2C45C; --amber-soft: #35290E;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1613; --surface: #16211D; --ink: #E7F0EC; --muted: #93A59D; --line: #26342E;
  --accent: #3DD29A; --accent-ink: #06261A; --accent-soft: #12372A;
  --warn: #FF9B6B; --warn-soft: #3A2218; --amber: #F2C45C; --amber-soft: #35290E;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px rgba(0, 0, 0, .35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 560px; margin: 0 auto; padding-block: 20px 170px; display: flex; flex-direction: column; gap: 18px; }

/* En-tête */
.top { display: flex; flex-direction: column; gap: 2px; }
.toprow { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
input.shop[type="text"], div.shop {
  width: 100%; border: 0; border-bottom: 2px dashed transparent; border-radius: 0; background: transparent; min-height: 0;
  font-family: var(--font-display); font-weight: 700; font-size: 1.5rem; line-height: 1.3; padding: 2px 0; color: var(--ink);
}
input.shop[type="text"]::placeholder { color: var(--muted); }
input.shop[type="text"]:hover, input.shop[type="text"]:focus { border-bottom-color: var(--line); outline: none; }
input.shop[type="text"]:focus-visible { border-bottom-color: var(--accent); }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 5px 11px; font-size: 12.5px; font-weight: 700; white-space: nowrap; color: var(--muted); min-height: 32px; }
.chip.pro { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.chip.exp { background: var(--warn-soft); border-color: transparent; color: var(--warn); }

/* Total */
.hero { background: var(--accent); color: var(--accent-ink); border-radius: 22px; padding: 20px 20px 18px; box-shadow: var(--shadow); }
.hero .label { font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; opacity: .85; }
.hero .big { font-family: var(--font-display); font-weight: 700; font-size: clamp(2.3rem, 11vw, 3.3rem); line-height: 1.05; margin-top: 4px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.hero .big small { font-size: .45em; font-weight: 600; margin-left: 6px; opacity: .85; }
.hero .sub { margin-top: 8px; font-size: 14px; opacity: .92; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; padding-top: 14px; border-top: 1px solid color-mix(in srgb, var(--accent-ink) 28%, transparent); }
.stat .k { font-size: 12px; opacity: .8; }
.stat .v { font-family: var(--font-display); font-weight: 600; font-size: 1.1rem; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }

/* Onglets de filtre */
.tabs { display: flex; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px; }
.tab { flex: 1; border: 0; background: transparent; border-radius: 10px; padding: 9px 6px; font-weight: 600; color: var(--muted); min-width: 0; }
.tab[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); }
.tab .n { font-variant-numeric: tabular-nums; margin-left: 4px; opacity: .8; }

/* Listes et cartes */
.list { display: flex; flex-direction: column; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px 14px 12px; display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.row > * { min-width: 0; }
.who { font-weight: 700; font-size: 1.02rem; overflow-wrap: anywhere; }
.what { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
.rest { text-align: right; flex-shrink: 0; }
.rest .amt { font-family: var(--font-display); font-weight: 700; font-size: 1.3rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
.rest .cap { font-size: 12px; color: var(--muted); }
.bar-track { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--accent); border-radius: 99px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.pill { display: inline-block; padding: 2px 9px; border-radius: 99px; font-size: 12px; font-weight: 700; }
.pill.late { background: var(--warn-soft); color: var(--warn); }
.pill.soon { background: var(--amber-soft); color: var(--amber); }
.pill.ok { background: var(--accent-soft); color: var(--accent); }
.pill.ex { background: var(--line); color: var(--muted); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 9px 13px; font-weight: 600; font-size: 14px; text-decoration: none; color: var(--ink); display: inline-flex; align-items: center; justify-content: center; min-height: 40px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.wa { border-color: var(--accent); color: var(--accent); }
.btn.ghost { border-color: transparent; color: var(--muted); padding-inline: 8px; }
.btn.danger { color: var(--warn); border-color: var(--warn); }
.btn.block { width: 100%; }
.spacer { flex: 1; }
.panel { background: var(--bg); border-radius: 12px; padding: 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
.panel .field { flex: 1 1 130px; }
details.hist { font-size: 13px; color: var(--muted); }
details.hist summary { cursor: pointer; font-weight: 600; min-height: 28px; display: flex; align-items: center; }
.hist-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 0; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.hist-row > span { min-width: 0; overflow-wrap: anywhere; }

/* Champs */
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field label { font-size: 13px; font-weight: 600; }
.field .hint { font-size: 12px; color: var(--muted); }
.field .err { font-size: 12px; color: var(--warn); font-weight: 600; }
input[type="text"], input[type="tel"], input[type="date"], input[type="search"], select, textarea {
  width: 100%; min-height: 44px; padding: 9px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface);
}
textarea { min-height: 96px; resize: vertical; }
input[aria-invalid="true"] { border-color: var(--warn); }
.amt-input, .code-input { font-variant-numeric: tabular-nums; }
.code-input { letter-spacing: .12em; text-transform: uppercase; font-weight: 700; }

/* États vides, notes, bandeaux */
.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.empty h2 { margin: 0; font-family: var(--font-display); font-size: 1.15rem; text-wrap: balance; }
.empty p { margin: 0; color: var(--muted); }
.note { font-size: 12.5px; color: var(--muted); text-align: center; margin: 0; }
.banner { background: var(--amber-soft); color: var(--amber); border-radius: 14px; padding: 10px 12px; font-size: 13.5px; font-weight: 600; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

/* Réglages */
.sect { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.sect h2 { margin: 0; font-family: var(--font-display); font-size: 1.1rem; }
.sect p { margin: 0; color: var(--muted); font-size: 14px; }
.sect ol { margin: 0; padding-left: 20px; color: var(--ink); font-size: 14px; display: flex; flex-direction: column; gap: 4px; }
.kv { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; }
.kv b { font-variant-numeric: tabular-nums; text-align: right; overflow-wrap: anywhere; }
.cid { font-family: var(--font-display); font-weight: 700; font-size: 1.5rem; letter-spacing: .1em; }

/* Bilan */
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 380px) { .cols { grid-template-columns: 1fr; } }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; min-width: 0; }
.kpi .k { font-size: 12px; color: var(--muted); font-weight: 600; }
.kpi .v { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.chart-wrap { overflow-x: auto; }
.chart-wrap svg { display: block; width: 100%; min-width: 300px; height: auto; }
.ax { fill: var(--muted); font-size: 9px; font-family: var(--font-body); }
.legend { display: flex; gap: 14px; font-size: 12.5px; color: var(--muted); flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.mrow { display: flex; flex-direction: column; gap: 4px; }
.mrow .t { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; font-variant-numeric: tabular-nums; }

/* Navigation et bouton flottant */
.nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); display: flex; justify-content: center; z-index: 10;
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.nav-in { display: flex; width: 100%; max-width: 560px; gap: 4px; }
.nav button { flex: 1; border: 0; background: transparent; border-radius: 12px; padding: 6px 4px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; font-weight: 600; color: var(--muted); min-height: 52px; }
.nav button[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }
.nav svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.fab { position: fixed; z-index: 9; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(76px + env(safe-area-inset-bottom, 0px));
  border: 0; border-radius: 99px; background: var(--accent); color: var(--accent-ink); font-family: var(--font-display); font-weight: 700; font-size: 16px;
  padding: 0 20px; min-height: 52px; box-shadow: var(--shadow); display: inline-flex; align-items: center; gap: 8px; }
.fab svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; }

/* Feuille de saisie */
.overlay { position: fixed; inset: 0; background: rgba(8, 14, 12, .55); display: flex; align-items: flex-end; justify-content: center; z-index: 20; }
.sheet { background: var(--bg); width: 100%; max-width: 560px; max-height: 94%; overflow-y: auto; border-radius: 22px 22px 0 0;
  padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 14px; }
.sheet h2 { margin: 0; font-family: var(--font-display); font-size: 1.3rem; }
.sheet p { margin: 0; color: var(--muted); font-size: 14px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 420px) { .two { grid-template-columns: 1fr; } }
.plan { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; min-height: 48px; cursor: pointer; }
.plan input { width: 20px; height: 20px; accent-color: var(--accent); flex: none; }
.plan .pn { flex: 1; font-weight: 600; min-width: 0; }
.plan .pp { font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; }
.plan:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(138px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg);
  padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 14px; max-width: min(92vw, 520px); z-index: 30; box-shadow: var(--shadow); }
@media (prefers-reduced-motion: no-preference) {
  .bar-fill { transition: width .35s ease; }
  .toast { animation: rise .2s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }
}
</style>

<div class="wrap" id="app"></div>
<button class="fab" id="fab" type="button" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Nouvelle vente</button>

<div class="overlay" id="overlay" hidden></div>

const Logic = (() => {
  const nf = new Intl.NumberFormat('fr-FR');

  const daysUntil = (due, today) => dayNum(due) - dayNum(today);
  const fmtDate = s => { if (!s) return ''; const [y, m, d] = s.split('-'); return d + '/' + m + '/' + y; };

  /* ---------- onglet Bilan ---------- */
  function chart(series) {
    const W = 340, Ht = 176, x0 = 40, x1 = 334, y0 = 12, y1 = 144;
    const max = L.niceMax(Math.max.apply(null, series.map(s => Math.max(s.sales, s.collected))));
    const gw = (x1 - x0) / series.length, bw = 15;
    const y = v => y1 - (v / max) * (y1 - y0);
    const svg = sv('svg', { viewBox: '0 0 ' + W + ' ' + Ht, role: 'img', 'aria-label': 'Ventes et encaissements des 6 derniers mois' });
    [0, 0.5, 1].forEach(f => {
      const v = max * f;
      svg.append(sv('line', { x1: x0, x2: x1, y1: y(v), y2: y(v), stroke: 'var(--line)', 'stroke-width': 1 }));
      svg.append(sv('text', { x: x0 - 5, y: y(v) + 3, 'text-anchor': 'end', class: 'ax' }, L.short(v)));
    });
    series.forEach((s, i) => {
      const cx = x0 + gw * i + gw / 2;
      [[s.sales, 'var(--line)', -bw - 1.5, 'sales'], [s.collected, 'var(--accent)', 1.5, 'col']].forEach(([v, fill, dx]) => {
        const hgt = Math.max(v > 0 ? 2 : 0, y1 - y(v));
        svg.append(sv('rect', { x: cx + dx, y: y1 - hgt, width: bw, height: hgt, rx: 3, fill }));
      });
      svg.append(sv('text', { x: cx, y: y1 + 15, 'text-anchor': 'middle', class: 'ax' }, s.label));
    });
    return svg;
  }

  function exportData() {
    return JSON.stringify({ app: 'carnet-boutique', v: 2, exported: new Date().toISOString(), orders: D.orders, settings: D.settings, lic: D.lic, cid: D.cid, created: D.created });
  }
  function markBackup() { D.settings.lastBackup = today(); save(); render(); }
  function downloadBackup() {
    try {
      const blob = new Blob([exportData()], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'carnet-boutique-sauvegarde-' + today() + '.json';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      markBackup(); toast('Sauvegarde enregistrée dans vos téléchargements.');
    } catch (e) { toast('Enregistrement impossible. Utilisez « Copier la sauvegarde ».'); }
  }
  function copyBackup() {
    try { navigator.clipboard.writeText(exportData()).then(() => { markBackup(); toast('Sauvegarde copiée. Collez-la dans un message à vous-même.'); }, () => toast('Copie impossible. Utilisez « Enregistrer un fichier ».')); }
    catch (e) { toast('Copie impossible. Utilisez « Enregistrer un fichier ».'); }
  }
  function restore(text) {
    let j;
    try { j = JSON.parse(text); } catch (e) { return 'Ce texte n’est pas une sauvegarde valide.'; }
    if (!L.validBackup(j)) return 'Cette sauvegarde est incomplète ou ne vient pas du Carnet Boutique.';
    D.orders = j.orders;
    D.settings = Object.assign(D.settings, j.settings || {});
    if (j.lic && typeof j.lic === 'object') D.lic = Object.assign({ until: '', used: [] }, j.lic);
    if (j.cid && License.validClientId(j.cid)) D.cid = j.cid;
    D.created = Math.max(D.created, j.created || 0, D.orders.filter(o => !o.example).length);
    save(); render();
    return '';
  }

        fieldEl('f-phone', 'WhatsApp du client (facultatif)', inp('f-phone', 'phone', { type: 'tel', inputmode: 'tel', autocomplete: 'off', placeholder: '01 97 00 00 00' }), errs['f-phone'],
          'Numéro du Bénin : 10 chiffres. Autre pays : commencez par + et l’indicatif.'),
        fieldEl('f-due', 'Date limite de paiement (facultatif)', inp('f-due', 'due', { type: 'date' }), null),
        h('div', { class: 'actions' },
          h('button', { class: 'btn primary', type: 'submit', style: 'flex:1' }, o ? 'Enregistrer les changements' : 'Enregistrer la vente'),
          h('button', { class: 'btn', type: 'button', onclick: closeSheet }, 'Annuler')));
      openSheet(form);
    };
    const submit = () => {
      const errs = {};
      const total = L.toInt(F.total), paid = L.toInt(F.paid);
      if (!F.name.trim()) errs['f-name'] = 'Entrez le nom du client.';
      if (!F.item.trim()) errs['f-item'] = 'Dites ce qui a été vendu.';
      if (total <= 0) errs['f-total'] = 'Entrez le montant total.';
      else if (o && total < L.paidSum(o)) errs['f-total'] = 'Le total est inférieur à ce qui a déjà été payé (' + L.money(L.paidSum(o)) + ').';
      else if (!o && paid > total) errs['f-paid'] = 'Le montant payé dépasse le total.';
      if (F.phone.trim() && !L.normPhone(F.phone)) errs['f-phone'] = 'Numéro incomplet. Vérifiez le nombre de chiffres.';
      if (Object.keys(errs).length) { draw(errs); const f = $(Object.keys(errs)[0]); if (f) f.focus(); return; }
      const t = today();
      if (o) {
        closeSheet();
        saveOrder(Object.assign({}, o, { name: F.name.trim(), phone: F.phone.trim(), item: F.item.trim(), total, due: F.due || '' }));
        toast('Vente modifiée.');
        return;
      }
      const n = { id: newId(), name: F.name.trim(), phone: F.phone.trim(), item: F.item.trim(), total, due: F.due || '', date: t,
        createdAt: new Date().toISOString() + Math.random(), payments: paid > 0 ? [{ amt: paid, date: t, method: 'Espèces' }] : [] };
      D.created += 1;
      closeSheet();
      if (V.tab !== 'sales') V.tab = 'sales';
      V.filter = L.remaining(n) > 0 ? 'open' : 'paid'; V.q = '';
      saveOrder(n);
      askPersist();
      toast(L.remaining(n) > 0 ? 'Vente ajoutée. Reste ' + L.money(L.remaining(n)) + ' à encaisser.' : 'Vente ajoutée et déjà soldée.');
    };
    draw({});
    const f = $('f-name'); if (f) f.focus();
  }

  function openProSheet(limitHit) {
    const draw = (err) => {
      const st = proState();
      const owner = CFG.ownerPhone ? L.normPhone(CFG.ownerPhone) : '';
      const plans = CFG.plans || [];
      const plan = plans.find(p => p.m === V.plan) || plans[0] || { m: 1, price: 0 };
      V.plan = plan.m;
      const msg = 'Bonjour' + (CFG.ownerName ? ' ' + CFG.ownerName : '') + ', j’ai payé ' + L.money(plan.price) + ' pour ' + plan.m + ' mois de Carnet Boutique. Mon numéro client : ' + License.fmtClientId(D.cid) + '.';
      const codeIn = h('input', { id: 'lic-code', class: 'code-input', type: 'text', autocomplete: 'off', autocapitalize: 'characters', placeholder: 'XXXX-XXXX-XXXX', maxlength: '16', 'aria-invalid': err ? 'true' : null, 'aria-describedby': err ? 'lic-code-err' : null });
      const activate = () => {
        const r = L.applyCode(D.lic, D.cid, codeIn.value, today());
        if (!r.ok) {
          draw(r.reason === 'used' ? 'Ce code a déjà été utilisé.' : r.reason === 'invalid' ? 'Ce code ne correspond pas à votre numéro client. Vérifiez qu’il n’y a pas d’erreur de frappe.' : 'Le code doit contenir 12 caractères (lettres et chiffres).');
          const c = $('lic-code'); if (c) { c.value = codeIn.value; c.focus(); }
          return;
        }
        D.lic = r.lic; save(); closeSheet(); render();
        toast('Abonnement activé jusqu’au ' + L.fmtDate(r.until) + '.');
      };
      codeIn.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); activate(); } });
      const sheet = h('div', { class: 'sheet', role: 'dialog', 'aria-label': 'Abonnement' },
        h('h2', null, limitHit === true ? 'Vous avez utilisé vos ' + (CFG.freeSales || 15) + ' ventes gratuites' : st === 'pro' ? 'Prolonger l’abonnement' : 'Passer à Pro'),
        h('p', null, limitHit === true ? 'Vos ventes restent visibles et vous pouvez encaisser les paiements. Pour en ajouter de nouvelles, activez l’abonnement.' : 'Ventes illimitées, clients, bilan et relances WhatsApp.'),
        h('div', { class: 'list', role: 'radiogroup', 'aria-label': 'Durée' }, plans.map(p =>
          h('label', { class: 'plan' },
            h('input', { type: 'radio', name: 'plan', value: String(p.m), checked: p.m === V.plan, onchange: () => { V.plan = p.m; draw(''); } }),
            h('span', { class: 'pn' }, p.m + (p.m > 1 ? ' mois' : ' mois') + (p.tag ? ' · ' + p.tag : '')),
            h('span', { class: 'pp' }, L.money(p.price))))),
        owner
          ? h('ol', null,
            h('li', null, 'Envoyez ' + L.money(plan.price) + ' par Mobile Money au ' + L.prettyPhone(CFG.ownerPhone) + (CFG.ownerName ? ' (' + CFG.ownerName + ')' : '') + '.'),
            h('li', null, 'Touchez « J’ai payé » ci-dessous. Un message part avec votre numéro client.'),
            h('li', null, 'Vous recevez un code. Collez-le dans la case, puis touchez « Activer ».'))
          : h('p', null, 'Demandez votre code d’activation à la personne qui vous a donné le carnet, avec votre numéro client ci-dessous.'),
        h('div', { class: 'kv' }, h('span', null, 'Votre numéro client'), h('span', { class: 'cid' }, License.fmtClientId(D.cid))),
        owner ? h('a', { class: 'btn wa block', href: waLink(owner, msg), target: '_blank', rel: 'noopener' }, 'J’ai payé : prévenir sur WhatsApp') : null,
        h('div', { class: 'field' }, h('label', { for: 'lic-code' }, 'Code d’activation'), codeIn, err ? h('div', { class: 'err', id: 'lic-code-err' }, err) : null),
        h('div', { class: 'actions' },
          h('button', { class: 'btn primary', type: 'button', style: 'flex:1', onclick: activate }, 'Activer'),
          h('button', { class: 'btn', type: 'button', onclick: closeSheet }, 'Fermer')));
      openSheet(sheet);
    };
    draw('');
  }

  function openFeedbackSheet() {
    const price = ((CFG.plans || [])[0] || { price: 1500 }).price;
    const Q = { easy: '', weekly: '', pay: '', missing: '', name: '' };
    const OPT = {
      easy: ['Oui, très facile', 'Moyen', 'Difficile'],
      weekly: ['Oui', 'Peut-être', 'Non'],
      pay: ['Oui, ' + L.money(price) + ' par mois', 'Oui, mais moins cher', 'Non']
    };
    const owner = CFG.ownerPhone ? L.normPhone(CFG.ownerPhone) : '';
    const build = () => {
      const lines = ['Avis sur Carnet Boutique (version test)'];
      if (Q.easy) lines.push('Facile à utiliser : ' + Q.easy);
      if (Q.weekly) lines.push('Utilisation chaque semaine : ' + Q.weekly);
      if (Q.pay) lines.push('Paiement : ' + Q.pay);
      if (Q.missing.trim()) lines.push('Ce qui manque ou me gêne : ' + Q.missing.trim());
      if (Q.name.trim()) lines.push('De la part de : ' + Q.name.trim());
      lines.push('Ventes notées dans le carnet : ' + D.created);
      return lines.join('\n');
    };
    const preview = h('textarea', { id: 'fb-preview', readonly: 'readonly', 'aria-label': 'Message qui sera envoyé' });
    const link = h('a', { class: 'btn primary', style: 'flex:1', target: '_blank', rel: 'noopener', onclick: () => { D.settings.fbSent = today(); save(); render(); toast('Merci pour votre avis !'); } }, 'Envoyer sur WhatsApp');
    const upd = () => {
      const t = build();
      preview.value = t;
      link.href = owner ? waLink(owner, t) : 'https://wa.me/?text=' + encodeURIComponent(t);
    };
    const radios = (key, label) => h('div', { class: 'field', role: 'radiogroup', 'aria-label': label },
      h('label', null, label),
      OPT[key].map(o => h('label', { class: 'plan' },
        h('input', { type: 'radio', name: 'fb-' + key, value: o, onchange: () => { Q[key] = o; upd(); } }),
        h('span', { class: 'pn' }, o))));
    const missing = h('textarea', { id: 'fb-missing', placeholder: 'Ex. je voudrais ajouter une photo, un stock, une facture…', oninput: e => { Q.missing = e.target.value; upd(); } });
    const name = h('input', { id: 'fb-name', type: 'text', maxlength: '40', autocomplete: 'off', placeholder: 'Facultatif', oninput: e => { Q.name = e.target.value; upd(); } });
    upd();
    openSheet(h('div', { class: 'sheet', role: 'dialog', 'aria-label': 'Donner mon avis' },
      h('h2', null, 'Votre avis compte'),
      h('p', null, 'Répondez en 1 minute. Vous pourrez relire le message avant de l’envoyer.'),
      radios('easy', 'Est-ce facile à utiliser ?'),
      radios('weekly', 'L’utiliseriez-vous chaque semaine ?'),
      radios('pay', 'Paieriez-vous pour l’avoir ?'),
      h('div', { class: 'field' }, h('label', { for: 'fb-missing' }, 'Qu’est-ce qui manque ou vous gêne ?'), missing),
      h('div', { class: 'field' }, h('label', { for: 'fb-name' }, 'Votre prénom'), name),
      h('div', { class: 'field' }, h('label', { for: 'fb-preview' }, 'Message qui sera envoyé'), preview,
        h('div', { class: 'hint' }, owner ? 'Il part directement vers la personne qui vous a donné le carnet.' : 'WhatsApp vous demandera à qui l’envoyer. Choisissez la personne qui vous a donné le carnet.')),
      h('div', { class: 'actions' },
        link,
        h('button', { class: 'btn', type: 'button', onclick: () => copyText(build(), 'Message copié.') }, 'Copier'),
        h('button', { class: 'btn ghost', type: 'button', onclick: closeSheet }, 'Fermer'))));
  }

  function openWelcome() {
    const inp = h('input', { id: 'w-shop', type: 'text', maxlength: '60', placeholder: 'Ex. Atelier Mariam', value: D.settings.shop || '' });
    const go1 = () => { D.settings.shop = inp.value.trim(); D.settings.welcomed = true; save(); closeSheet(); render(); };
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); go1(); } });
    openSheet(h('div', { class: 'sheet', role: 'dialog', 'aria-label': 'Bienvenue' },
      h('h2', null, 'Bienvenue dans votre carnet'),
      h('p', null, 'Notez vos ventes, voyez qui vous doit de l’argent et relancez en un clic sur WhatsApp. Tout reste sur votre téléphone.'),
      CFG.test ? h('p', null, 'Ceci est la version test. Essayez-la quelques jours avec vos vraies ventes, puis touchez « Donner mon avis » en haut de l’écran.') : null,
      h('div', { class: 'field' }, h('label', { for: 'w-shop' }, 'Nom de votre boutique ou de votre activité'), inp),
      h('div', { class: 'actions' },
        h('button', { class: 'btn primary', type: 'button', style: 'flex:1', onclick: go1 }, 'Commencer'),
        h('button', { class: 'btn', type: 'button', onclick: () => { D.settings.shop = inp.value.trim(); closeSheet(); loadExamples(); } }, 'Voir un exemple'))));
    setTimeout(() => inp.focus(), 50);
  }

  /* ---------- rendu principal ---------- */
  function render() {
    const app = $('app');
    const view = V.tab === 'clients' ? viewClients() : V.tab === 'report' ? viewReport() : V.tab === 'settings' ? viewSettings() : viewSales();
    const keepScroll = window.scrollY;
    app.replaceChildren.apply(app, view.filter(Boolean));
    window.scrollTo(0, keepScroll);
    renderNav();
  }

  $('fab').addEventListener('click', () => openSaleSheet());
  $('overlay').addEventListener('click', e => { if (e.target.id === 'overlay') closeSheet(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && V.sheet) closeSheet(); });
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; if (V.tab === 'settings') render(); });
  window.addEventListener('appinstalled', () => { deferredInstall = null; if (V.tab === 'settings') render(); });
  try {
    if (CFG.offline && 'serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
      navigator.serviceWorker.register('sw.js').catch(() => { /* hors ligne non disponible */ });
    }
  } catch (e) { /* ignoré */ }

  load();
  save();
  render();
  if (!D.settings.welcomed && !D.orders.length) openWelcome();
})();
</script>

</body>
</html>
